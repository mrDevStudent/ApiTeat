<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gemini API Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0b0f14;
    --panel: #121822;
    --panel-2: #0e141d;
    --line: #232c38;
    --text: #e7edf5;
    --muted: #7c8a9c;
    --accent: #3ddc97;
    --accent-dim: #24614a;
    --user-bubble: #1a2432;
    --error: #ff6b6b;
    --mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
    --sans: 'Inter', -apple-system, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top: env(safe-area-inset-top, 0px);}
  html,body{height:100%;}
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    display:flex;
    flex-direction:column;
    height:100%;
    overflow:hidden;
  }

  /* ---------- header ---------- */
  header{
    flex:none;
    padding: 14px 16px;
    padding-top: calc(14px + env(safe-area-inset-top, 0px));
    border-bottom:1px solid var(--line);
    background: var(--panel);
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .title-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .title{
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .title .dot{
    width:8px;height:8px;border-radius:50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    flex:none;
  }
  .title h1{
    font-family: var(--mono);
    font-size:14px;
    font-weight:600;
    letter-spacing:.02em;
    margin:0;
    color: var(--text);
  }
  .title span.sub{
    font-family: var(--mono);
    font-size:11px;
    color: var(--muted);
  }
  #status-pill{
    font-family: var(--mono);
    font-size:10px;
    padding:3px 8px;
    border-radius:20px;
    border:1px solid var(--line);
    color: var(--muted);
    white-space:nowrap;
  }
  #status-pill.ready{ color: var(--accent); border-color: var(--accent-dim); }
  #status-pill.error{ color: var(--error); border-color: #5c2323; }

  .config-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .field{
    display:flex;
    flex-direction:column;
    gap:4px;
    flex:1;
    min-width:140px;
  }
  .field label{
    font-family: var(--mono);
    font-size:10px;
    color: var(--muted);
    letter-spacing:.03em;
  }
  .field input, .field select{
    background: var(--panel-2);
    border:1px solid var(--line);
    color: var(--text);
    font-family: var(--mono);
    font-size:12px;
    padding:8px 10px;
    border-radius:8px;
    outline:none;
    width:100%;
  }
  .field input:focus, .field select:focus{
    border-color: var(--accent-dim);
    box-shadow: 0 0 0 3px rgba(61,220,151,0.12);
  }
  .key-wrap{ position:relative; }
  .key-wrap input{ padding-right:60px; }
  .key-wrap button{
    position:absolute;
    right:4px; top:4px; bottom:4px;
    background:transparent;
    border:none;
    color: var(--muted);
    font-family: var(--mono);
    font-size:10px;
    padding:0 8px;
    cursor:pointer;
  }
  .key-wrap button:hover{ color: var(--text); }
  .hint{
    font-family: var(--mono);
    font-size:10px;
    color: var(--muted);
  }
  .hint a{ color: var(--accent); }

  /* ---------- chat ---------- */
  main{
    flex:1;
    overflow-y:auto;
    padding:18px 16px 8px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .empty{
    margin:auto;
    text-align:center;
    color: var(--muted);
    font-family: var(--mono);
    font-size:12px;
    max-width:320px;
    line-height:1.7;
  }
  .empty .big{
    font-size:28px;
    margin-bottom:6px;
  }
  .row{
    display:flex;
    max-width: 88%;
  }
  .row.user{ align-self:flex-end; justify-content:flex-end; }
  .row.model{ align-self:flex-start; }
  .bubble{
    padding:10px 13px;
    border-radius:12px;
    font-size:14px;
    line-height:1.5;
    white-space:pre-wrap;
    word-break:break-word;
  }
  .row.user .bubble{
    background: var(--user-bubble);
    border:1px solid var(--line);
    border-bottom-right-radius:3px;
  }
  .row.model .bubble{
    background: transparent;
    border:1px solid var(--accent-dim);
    border-bottom-left-radius:3px;
  }
  .row.model .bubble.pending{
    color: var(--muted);
    font-family: var(--mono);
    font-size:12px;
  }
  .row.error .bubble{
    border:1px solid #5c2323;
    color: var(--error);
    font-family: var(--mono);
    font-size:12px;
  }
  .meta{
    font-family: var(--mono);
    font-size:9px;
    color: var(--muted);
    margin-bottom:4px;
    letter-spacing:.04em;
  }
  .row.user .meta{ text-align:right; }

  /* ---------- input ---------- */
  footer{
    flex:none;
    padding:12px 16px;
    padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    border-top:1px solid var(--line);
    background: var(--panel);
    display:flex;
    gap:8px;
    align-items:flex-end;
  }
  #prompt{
    flex:1;
    resize:none;
    background: var(--panel-2);
    border:1px solid var(--line);
    color: var(--text);
    font-family: var(--sans);
    font-size:14px;
    padding:11px 13px;
    border-radius:10px;
    outline:none;
    max-height:120px;
    min-height:42px;
    line-height:1.4;
  }
  #prompt:focus{
    border-color: var(--accent-dim);
    box-shadow: 0 0 0 3px rgba(61,220,151,0.12);
  }
  #send{
    flex:none;
    background: var(--accent);
    color: #06140f;
    border:none;
    font-family: var(--mono);
    font-weight:700;
    font-size:12px;
    padding:0 18px;
    height:42px;
    border-radius:10px;
    cursor:pointer;
    letter-spacing:.02em;
  }
  #send:disabled{
    background: var(--panel-2);
    color: var(--muted);
    border:1px solid var(--line);
    cursor:not-allowed;
  }
  #send:not(:disabled):hover{ filter:brightness(1.08); }
  #clear-btn{
    background:none;
    border:none;
    color:var(--muted);
    font-family:var(--mono);
    font-size:10px;
    cursor:pointer;
    text-decoration:underline;
    padding:0;
  }
  #clear-btn:hover{ color: var(--text); }

  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background: var(--line); border-radius:4px; }

  @media (max-width:480px){
    .row{ max-width:94%; }
    .config-row{ flex-direction:column; }
  }
</style>
</head>
<body>

<header>
  <div class="title-row">
    <div class="title">
      <span class="dot"></span>
      <h1>gemini // api console</h1>
      <span class="sub">Google AI Studio tester</span>
    </div>
    <div id="status-pill">no key set</div>
  </div>

  <div class="config-row">
    <div class="field key-wrap" style="flex:2;">
      <label for="api-key">API key</label>
      <input id="api-key" type="password" placeholder="AIza..." autocomplete="off" spellcheck="false">
      <button id="toggle-key" type="button">show</button>
    </div>
    <div class="field" style="flex:1; min-width:170px;">
      <label for="model">Model</label>
      <select id="model">
        <option value="gemini-3.8-flash">gemini-3.8-flash</option>
        <option value="gemini-3.5-flash-lite">gemini-3.5-flash-lite</option>
        <option value="gemini-2.5-flash-lite">gemini-2.5-flash-lite</option>
        <option value="gemini-2.5-pro">gemini-2.5-pro</option>
        <option value="custom">custom (type below)</option>
      </select>
    </div>
  </div>
  <input id="custom-model" type="text" placeholder="custom model id, e.g. gemini-2.5-flash-preview-09-2025"
    style="display:none; background: var(--panel-2); border:1px solid var(--line); color: var(--text); font-family: var(--mono); font-size:12px; padding:8px 10px; border-radius:8px; outline:none;">

  <div class="hint">Key is stored only in this browser (localStorage) and sent directly to <span style="color:var(--text)">generativelanguage.googleapis.com</span>. Get a key at <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>.</div>
</header>

<main id="chat">
  <div class="empty" id="empty-state">
    <div class="big">◇</div>
    paste an API key above, pick a model,<br>and send a message to test it.
  </div>
</main>

<footer>
  <textarea id="prompt" placeholder="Type a message…" rows="1"></textarea>
  <button id="send">SEND</button>
</footer>

<script>
(function(){
  const $ = (id) => document.getElementById(id);
  const chat = $('chat');
  const emptyState = $('empty-state');
  const keyInput = $('api-key');
  const toggleKeyBtn = $('toggle-key');
  const modelSelect = $('model');
  const customModel = $('custom-model');
  const statusPill = $('status-pill');
  const promptEl = $('prompt');
  const sendBtn = $('send');

  let history = []; // {role: 'user'|'model', text: string}

  // ---- persisted key ----
  try {
    const savedKey = localStorage.getItem('gemini_test_key');
    if (savedKey) { keyInput.value = savedKey; updateStatus(); }
    const savedModel = localStorage.getItem('gemini_test_model');
    if (savedModel) {
      const opts = [...modelSelect.options].map(o => o.value);
      if (opts.includes(savedModel)) {
        modelSelect.value = savedModel;
      } else {
        modelSelect.value = 'custom';
        customModel.style.display = 'block';
        customModel.value = savedModel;
      }
    }
  } catch(e) { /* storage unavailable, continue without persistence */ }

  keyInput.addEventListener('input', () => {
    try { localStorage.setItem('gemini_test_key', keyInput.value); } catch(e){}
    updateStatus();
  });

  toggleKeyBtn.addEventListener('click', () => {
    const isPw = keyInput.type === 'password';
    keyInput.type = isPw ? 'text' : 'password';
    toggleKeyBtn.textContent = isPw ? 'hide' : 'show';
  });

  modelSelect.addEventListener('change', () => {
    if (modelSelect.value === 'custom') {
      customModel.style.display = 'block';
      customModel.focus();
    } else {
      customModel.style.display = 'none';
      try { localStorage.setItem('gemini_test_model', modelSelect.value); } catch(e){}
    }
  });
  customModel.addEventListener('input', () => {
    try { localStorage.setItem('gemini_test_model', customModel.value.trim()); } catch(e){}
  });

  function currentModel(){
    if (modelSelect.value === 'custom') return customModel.value.trim() || 'gemini-2.5-flash';
    return modelSelect.value;
  }

  function updateStatus(){
    if (keyInput.value.trim().length > 0){
      statusPill.textContent = 'key set';
      statusPill.className = 'ready';
    } else {
      statusPill.textContent = 'no key set';
      statusPill.className = '';
    }
  }

  function scrollToBottom(){
    chat.scrollTop = chat.scrollHeight;
  }

  function addBubble(role, text, opts){
    opts = opts || {};
    if (emptyState) { emptyState.remove(); }
    const row = document.createElement('div');
    row.className = 'row ' + (opts.error ? 'error' : role);
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = opts.error ? 'error' : (role === 'user' ? 'you' : currentModel());
    const bubble = document.createElement('div');
    bubble.className = 'bubble' + (opts.pending ? ' pending' : '');
    bubble.textContent = text;
    row.appendChild(meta);
    row.appendChild(bubble);
    chat.appendChild(row);
    scrollToBottom();
    return bubble;
  }

  function autoGrow(){
    promptEl.style.height = 'auto';
    promptEl.style.height = Math.min(promptEl.scrollHeight, 120) + 'px';
  }
  promptEl.addEventListener('input', autoGrow);
  promptEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      send();
    }
  });
  sendBtn.addEventListener('click', send);

  async function send(){
    const text = promptEl.value.trim();
    const key = keyInput.value.trim();
    if (!text) return;
    if (!key){
      addBubble('model', 'Add your Google AI Studio API key above first.', {error:true});
      return;
    }

    addBubble('user', text);
    history.push({ role: 'user', text });
    promptEl.value = '';
    autoGrow();
    sendBtn.disabled = true;

    const pending = addBubble('model', 'thinking…', {pending:true});

    const model = currentModel();
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`;

    const body = {
      contents: history.map(m => ({
        role: m.role === 'user' ? 'user' : 'model',
        parts: [{ text: m.text }]
      }))
    };

    try {
      const res = await fetch(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-goog-api-key': key
        },
        body: JSON.stringify(body)
      });
      const data = await res.json();

      if (!res.ok){
        const msg = (data && data.error && data.error.message) ? data.error.message : `HTTP ${res.status}`;
        pending.parentElement.classList.add('error');
        pending.classList.remove('pending');
        pending.textContent = msg;
        statusPill.textContent = 'request failed';
        statusPill.className = 'error';
        history.pop();
        return;
      }

      const candidate = data && data.candidates && data.candidates[0];
      const parts = candidate && candidate.content && candidate.content.parts;
      const replyText = (parts && parts.map(p => p.text || '').join('')) || '(empty response)';

      pending.classList.remove('pending');
      pending.textContent = replyText;
      history.push({ role: 'model', text: replyText });
      statusPill.textContent = 'key set';
      statusPill.className = 'ready';

    } catch (err){
      pending.parentElement.classList.add('error');
      pending.classList.remove('pending');
      pending.textContent = 'Network error: ' + (err && err.message ? err.message : String(err));
      history.pop();
    } finally {
      sendBtn.disabled = false;
      scrollToBottom();
    }
  }

  $('send').insertAdjacentHTML('afterend', '');
  const footer = document.querySelector('footer');
  const clearBtn = document.createElement('button');
  clearBtn.id = 'clear-btn';
  clearBtn.type = 'button';
  clearBtn.textContent = 'clear';
  clearBtn.style.display = 'none';

  updateStatus();
})();
</script>

</body>
</html>
